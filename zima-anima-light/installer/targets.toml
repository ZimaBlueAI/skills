# Zima Anima Light host targets for Work-class agents.

[cli.workbuddy]
name = "腾讯 WorkBuddy"
user_root = "~/.zima-anima-light/host-bundles/workbuddy"
register = "manual"
support_note = "Marketplace/手动导入；解压后按 WORKBUDDY-IMPORT.md。"

[cli.doubao-work]
name = "豆包 Work"
user_root = "~/.zima-anima-light/host-bundles/doubao-work"
register = "manual"
support_note = "按宿主技能导入说明复制 SKILL.md 目录。"

[cli.trae]
name = "TRAE (Work)"
user_root = "~/.zima-anima-light/host-bundles/trae"
register = "pointer"
support_note = "Rules 指针或 skills 目录，视版本而定。"

[cli.qoder]
name = "Qoder"
user_root = "~/.qoder/skills"
register = "none"

